server:
  port: 8081

spring:
  datasource:
    # PostgreSQL 连接配置（格式与 Oracle 的 jdbc:oracle:thin:@host:port:sid 类似）
    url: jdbc:postgresql://localhost:5432/order_ms
    username: postgres
    password: "1"
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password:           # 无密码留空
      database: 0
      timeout: 5000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.orderms.entity
  configuration:
    map-underscore-to-camel-case: true    # 数据库 snake_case → Java camelCase 自动转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置（自定义配置项）
jwt:
  secret: "OrderMsSecretKey2024!@#$%^&*OrderMsSecretKey2024!@#$%^&*"
  expiration: 86400000    # 24小时（毫秒）

# 日志
logging:
  level:
    com.example.orderms: DEBUG
    org.springframework.security: INFO
